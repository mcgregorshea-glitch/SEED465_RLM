<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLM POP Data Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
        }
        #plot {
            width: 100%;
            height: 80vh;
        }
        .error {
            color: #f85149;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Proof of Power (POP) Data Visualizer</h1>
    <div id="error-msg" class="error"></div>
    <div id="plot"></div>

    <script>
        // Fetch the processed JSON data generated by pop_utility.py
        fetch('processed_pop.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load processed_pop.json: ${response.statusText}`);
                }
                return response.json();
            })
            .then(data => {
                if (!data || data.length === 0) {
                    throw new Error("No data found in processed_pop.json");
                }

                // Extract arrays for plotting
                // We map over the JSON array to extract columns
                const timestamps = data.map(row => row.Timestamp || row.timestamp || null);
                const voltages = data.map(row => row.Voltage || row.voltage || null);
                const currents = data.map(row => row.Current || row.current || null);

                // Create traces
                const traceVoltage = {
                    x: timestamps,
                    y: voltages,
                    mode: 'lines+markers',
                    name: 'Voltage (V)',
                    line: { color: '#00d4ff' }
                };

                const traceCurrent = {
                    x: timestamps,
                    y: currents,
                    mode: 'lines+markers',
                    name: 'Current (A)',
                    yaxis: 'y2',
                    line: { color: '#3fb950' }
                };

                // Layout configuration
                const layout = {
                    title: 'System Voltage & Current vs Time',
                    paper_bgcolor: '#161b22',
                    plot_bgcolor: '#161b22',
                    font: { color: '#e6edf3' },
                    xaxis: { title: 'Time / Index' },
                    yaxis: { title: 'Voltage (V)', titlefont: {color: '#00d4ff'}, tickfont: {color: '#00d4ff'} },
                    yaxis2: {
                        title: 'Current (A)',
                        titlefont: {color: '#3fb950'},
                        tickfont: {color: '#3fb950'},
                        overlaying: 'y',
                        side: 'right'
                    },
                    hovermode: 'x unified'
                };

                Plotly.newPlot('plot', [traceVoltage, traceCurrent], layout, {responsive: true});
            })
            .catch(error => {
                document.getElementById('error-msg').innerText = error.message;
            });
    </script>
</body>
</html>
